services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_URL} #optional
    volumes:
      - ./config:/config
      - ${MOVIES_DIR}:/data/movies:ro
      - ${SHOWS_DIR}:/data/shows:ro
      - ${YT_DIR}:/data/youtube:ro
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128 #Use for Intel QuickSync
    ports:
      - "${LAN_BIND_IP}:${JELLYFIN_PORT}:8096"
      - "${LAN_BIND_IP}:7359:7359/udp" #Service Discovery
      - "${LAN_BIND_IP}:1900:1900/udp" #Client Discovery
    restart: unless-stopped

  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    environment:
      - LOG_LEVEL=debug
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://${LAN_BIND_IP}:${SEERR_PORT}/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./seerr:/app/config
    ports:
      - "${LAN_BIND_IP}:${SEERR_PORT}:5055"

  jellystat-db:
    image: postgres:18.1
    container_name: jellystat-db
    restart: unless-stopped
    shm_size: '1gb'
    environment:
      POSTGRES_USER: ${JELLYSTAT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JELLYSTAT_POSTGRES_PASSWORD}
    volumes:
      - ./jellystat/postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U \"$${POSTGRES_USER}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${JELLYSTAT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JELLYSTAT_POSTGRES_PASSWORD} # must match jellystat-db
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      JWT_SECRET: "${JELLYSTAT_JWT_SECRET}"
      TZ: ${TZ}
    user: "${PUID}:${PGID}"
    volumes:
      - ./jellystat/backup-data:/app/backend/backup-data
    ports:
      - "${LAN_BIND_IP}:${JELLYSTAT_PORT}:3000"
    depends_on:
      jellystat-db:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/auth/isConfigured || exit 1
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
